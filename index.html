<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🏎️ Дорожный прорыв</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #game-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.5s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ffdd00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: #888; font-size: 16px; }
        
        /* ============================================================ */
        /* ЭКРАН ВЫБОРА СЛОЖНОСТИ */
        /* ============================================================ */
        #difficulty-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            backdrop-filter: blur(15px);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #difficulty-screen .content {
            background: rgba(0,0,0,0.95);
            padding: 40px 50px;
            border-radius: 25px;
            border: 2px solid rgba(255,255,255,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 80px rgba(0,0,0,0.9);
        }
        #difficulty-screen h1 {
            font-size: 28px;
            color: #ffdd00;
            margin-bottom: 8px;
        }
        #difficulty-screen .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }
        #difficulty-screen .best-time {
            color: #4caf50;
            font-size: 14px;
            margin-bottom: 20px;
        }
        #difficulty-screen .quality-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 15px 0 20px 0;
        }
        #difficulty-screen .quality-selector .q-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        #difficulty-screen .quality-selector .q-btn:hover {
            border-color: rgba(255,255,255,0.3);
        }
        #difficulty-screen .quality-selector .q-btn.active {
            border-color: #ffdd00;
            color: #fff;
            background: rgba(255,220,0,0.15);
        }
        #difficulty-screen .difficulty-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        #difficulty-screen .difficulty-btn:hover {
            transform: scale(1.02);
            border-color: #ffdd00;
        }
        #difficulty-screen .difficulty-btn .desc {
            font-weight: normal;
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        #difficulty-screen .difficulty-btn.easy { border-color: rgba(76, 175, 80, 0.4); }
        #difficulty-screen .difficulty-btn.easy:hover { background: rgba(76, 175, 80, 0.15); }
        #difficulty-screen .difficulty-btn.medium { border-color: rgba(255, 193, 7, 0.4); }
        #difficulty-screen .difficulty-btn.medium:hover { background: rgba(255, 193, 7, 0.15); }
        #difficulty-screen .difficulty-btn.hard { border-color: rgba(244, 67, 54, 0.4); }
        #difficulty-screen .difficulty-btn.hard:hover { background: rgba(244, 67, 54, 0.15); }

        /* ============================================================ */
        /* МОБИЛЬНОЕ УПРАВЛЕНИЕ */
        /* ============================================================ */
        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            z-index: 150;
            display: none;
            padding: 0 20px;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            touch-action: none;
        }
        #mobile-controls.active {
            display: flex;
        }
        .control-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            color: #fff;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: all 0.15s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .control-btn:active, .control-btn.active {
            background: rgba(255,255,255,0.25);
            transform: scale(0.92);
            border-color: rgba(255,220,0,0.6);
        }
        .control-btn.gas { background: rgba(0,200,50,0.2); border-color: rgba(0,200,50,0.4); }
        .control-btn.gas:active, .control-btn.gas.active { background: rgba(0,200,50,0.4); border-color: rgba(0,200,50,0.8); }
        .control-btn.brake { background: rgba(200,0,0,0.2); border-color: rgba(200,0,0,0.4); }
        .control-btn.brake:active, .control-btn.brake.active { background: rgba(200,0,0,0.4); border-color: rgba(200,0,0,0.8); }
        .control-btn.steer { width: 60px; height: 60px; font-size: 22px; }
        .control-group-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }
        .control-group-center .control-btn { width: 60px; height: 60px; font-size: 20px; }

        @media (max-width: 768px) {
            .control-btn { width: 60px; height: 60px; font-size: 24px; }
            .control-btn.steer { width: 50px; height: 50px; font-size: 18px; }
            .control-group-center .control-btn { width: 50px; height: 50px; font-size: 18px; }
            #mobile-controls { padding: 0 10px; bottom: 15px; }
        }
        @media (max-width: 480px) {
            .control-btn { width: 50px; height: 50px; font-size: 20px; }
            .control-btn.steer { width: 42px; height: 42px; font-size: 16px; }
            .control-group-center .control-btn { width: 42px; height: 42px; font-size: 16px; }
            #mobile-controls { padding: 0 8px; bottom: 10px; }
        }

        /* ============================================================ */
        /* ПОЛЗУНКИ ГРОМКОСТИ */
        /* ============================================================ */
        #volume-controls {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #volume-controls .slider-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        #volume-controls .slider-group label {
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #volume-controls .slider-group input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.2);
            outline: none;
            cursor: pointer;
        }
        #volume-controls .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffdd00;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,220,0,0.3);
        }
        #volume-controls .slider-group input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffdd00;
            cursor: pointer;
            border: none;
        }
        #volume-controls .volume-value {
            color: rgba(255,255,255,0.5);
            font-size: 10px;
            min-width: 30px;
            text-align: center;
        }
        #music-status {
            color: rgba(255,255,255,0.3);
            font-size: 9px;
            text-align: center;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            #volume-controls { right: 10px; padding: 10px 12px; gap: 12px; }
            #volume-controls .slider-group input[type="range"] { width: 50px; }
            #volume-controls .slider-group label { font-size: 9px; }
        }
    </style>
</head>
<body>
    <!-- ЗАГРУЗОЧНЫЙ ЭКРАН -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Загрузка игры...</p>
    </div>

    <div id="game-container"></div>
    
    <!-- ЭКРАН ВЫБОРА СЛОЖНОСТИ -->
    <div id="difficulty-screen">
        <div class="content">
            <h1>🏎️ ДОРОЖНЫЙ ПРОРЫВ</h1>
            <div class="sub">Выберите сложность</div>
            <div class="best-time" id="bestTimeDisplay">🏆 Лучшее время: --</div>
            
            <div class="quality-selector">
                <button class="q-btn low" data-quality="low">🚀 Низкое</button>
                <button class="q-btn medium active" data-quality="medium">⚡ Среднее</button>
                <button class="q-btn high" data-quality="high">🔥 Высокое</button>
            </div>
            
            <button class="difficulty-btn easy" data-diff="easy">🟢 ЛЁГКИЙ<div class="desc">Короткая трасса · Мало животных</div></button>
            <button class="difficulty-btn medium" data-diff="medium">🟡 СРЕДНИЙ<div class="desc">Стандартная трасса · Средняя плотность</div></button>
            <button class="difficulty-btn hard" data-diff="hard">🔴 СЛОЖНЫЙ<div class="desc">Длинная трасса · Много животных · Ночная зона</div></button>
        </div>
    </div>

    <!-- МОБИЛЬНОЕ УПРАВЛЕНИЕ -->
    <div id="mobile-controls">
        <div class="control-group">
            <div class="control-btn steer" id="btnLeft">◀</div>
            <div class="control-btn steer" id="btnRight">▶</div>
        </div>
        <div class="control-group-center">
            <div class="control-btn brake" id="btnBrake">⏬</div>
            <div class="control-btn gas" id="btnGas">⏫</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        window.THREE = THREE;

        console.log('=== 🏎️ ДОРОЖНЫЙ ПРОРЫВ ===');

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (ДОБАВЛЯЕМ!)
        // ============================================================
        function clamp(val, min, max) {
            return Math.min(Math.max(val, min), max);
        }
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        // ============================================================
        // СКРЫВАЕМ ЗАГРУЗОЧНЫЙ ЭКРАН
        // ============================================================
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.classList.add('hidden');
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 500);
            }
        }, 300);

        // ============================================================
        // РАБОТА С localStorage
        // ============================================================
        const STORAGE_KEY = 'road_racing_best_times';

        function getBestTimes() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : { easy: null, medium: null, hard: null };
            } catch { return { easy: null, medium: null, hard: null }; }
        }

        function saveBestTime(difficulty, time) {
            const times = getBestTimes();
            if (times[difficulty] === null || time < times[difficulty]) {
                times[difficulty] = time;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(times));
                return true;
            }
            return false;
        }

        function formatTime(time) {
            if (time === null || time === undefined || time === Infinity) return '--';
            const m = Math.floor(time / 60);
            const s = Math.floor(time % 60);
            const ms = Math.floor((time % 1) * 10);
            return `${m}:${String(s).padStart(2, '0')}.${ms}`;
        }

        // ============================================================
        // НАСТРОЙКИ СЛОЖНОСТИ
        // ============================================================
        const DIFFICULTY_CONFIG = {
            easy: {
                label: '🟢 Лёгкий',
                trackLength: 1200,
                timeLimit: 90,
                maxAnimals: 20,
                maxCars: 12,
                maxObstacles: 15,
                trees: 20,
                animalSpawnRate: 1.5,
                hasNightZone: false,
                triggerLookahead: 18
            },
            medium: {
                label: '🟡 Средний',
                trackLength: 1800,
                timeLimit: 120,
                maxAnimals: 30,
                maxCars: 20,
                maxObstacles: 25,
                trees: 35,
                animalSpawnRate: 1.0,
                hasNightZone: true,
                triggerLookahead: 14
            },
            hard: {
                label: '🔴 Сложный',
                trackLength: 2400,
                timeLimit: 150,
                maxAnimals: 40,
                maxCars: 28,
                maxObstacles: 35,
                trees: 50,
                animalSpawnRate: 0.7,
                hasNightZone: true,
                triggerLookahead: 12
            }
        };

        // ============================================================
        // КЭШИРОВАННЫЕ ВЕКТОРЫ
        // ============================================================
        const _v = {
            pos: new THREE.Vector3(),
            vel: new THREE.Vector3(),
            p1: new THREE.Vector3(),
            p2: new THREE.Vector3(),
            p3: new THREE.Vector3(),
            p4: new THREE.Vector3(),
            dir: new THREE.Vector3()
        };

        // ============================================================
        // БАЗА ДАННЫХ ВИДОВ ЖИВОТНЫХ
        // ============================================================
        const ANIMAL_TYPES = {
            DOG: { id: 'dog', name: 'Собака', width: 0.63, height: 0.48, color: 0xA0522D, accentColor: 0x8B4513, speedCross: 4.0, speedZ: 0.02, penalty: 0.35, timePenalty: 4, radius: 0.75, design: 'dog', emoji: '🐕' },
            CAT: { id: 'cat', name: 'Кот', width: 0.50, height: 0.38, color: 0xFF8C00, accentColor: 0xFFE4B5, speedCross: 5.0, speedZ: 0.015, penalty: 0.25, timePenalty: 3, radius: 0.63, design: 'cat', emoji: '🐈' },
            DEER: { id: 'deer', name: 'Олень', width: 0.88, height: 0.81, color: 0xCD853F, accentColor: 0xFFFFFF, speedCross: 5.5, speedZ: 0.025, penalty: 0.45, timePenalty: 6, radius: 1.00, design: 'deer', emoji: '🦌' },
            BOAR: { id: 'boar', name: 'Кабан', width: 0.81, height: 0.63, color: 0x4A3B32, accentColor: 0x1A1A1A, speedCross: 3.5, speedZ: 0.02, penalty: 0.5, timePenalty: 5, radius: 0.94, design: 'boar', emoji: '🐗' },
            FOX: { id: 'fox', name: 'Лиса', width: 0.56, height: 0.41, color: 0xFF4500, accentColor: 0xFFFFFF, speedCross: 4.5, speedZ: 0.018, penalty: 0.3, timePenalty: 3.5, radius: 0.69, design: 'fox', emoji: '🦊' },
            BEAR: { id: 'bear', name: 'Медведь', width: 1.13, height: 1.00, color: 0x5C4033, accentColor: 0x3D2B1F, speedCross: 2.5, speedZ: 0.015, penalty: 0.6, timePenalty: 7, radius: 1.25, design: 'bear', emoji: '🐻' },
            HUMAN: { id: 'human', name: 'Человек', width: 0.53, height: 0.56, color: 0xE8C9A0, accentColor: 0x3366CC, speedCross: 4.0, speedZ: 0.025, penalty: 0.2, timePenalty: 3, radius: 0.65, design: 'human', emoji: '👤' }
        };
        const ANIMAL_KEYS = Object.keys(ANIMAL_TYPES);

        // ============================================================
        // РИСОВАНИЕ ЖИВОТНЫХ НА CANVAS (СОКРАЩЕНО)
        // ============================================================
        function drawCat(ctx, w, h, color, accentColor, legWiggle) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(w/2 - 4, -h/4, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(w/2 - 8, -h/2 - 4);
            ctx.lineTo(w/2 - 14, -h/2 - 14);
            ctx.lineTo(w/2 - 2, -h/2 - 6);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(w/2 + 4, -h/2 - 4);
            ctx.lineTo(w/2 + 10, -h/2 - 14);
            ctx.lineTo(w/2 + 16, -h/2 - 6);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(w/2 - 6, -h/4 - 2, 3, 0, Math.PI * 2);
            ctx.arc(w/2 + 2, -h/4 - 2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(w/2 - 4, -h/4 - 1, 1.5, 0, Math.PI * 2);
            ctx.arc(w/2 + 4, -h/4 - 1, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff9999';
            ctx.beginPath();
            ctx.arc(w/2 - 2, -h/4 + 4, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            for (let i = -2; i <= 2; i+=2) {
                ctx.beginPath();
                ctx.moveTo(w/2 - 4, -h/4 + 4 + i);
                ctx.lineTo(w/2 - 12, -h/4 + 6 + i);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(w/2, -h/4 + 4 + i);
                ctx.lineTo(w/2 + 8, -h/4 + 6 + i);
                ctx.stroke();
            }
            ctx.fillStyle = accentColor;
            ctx.fillRect(-w/3, h/4, 4, 6 + legWiggle);
            ctx.fillRect(w/4, h/4, 4, 6 - legWiggle);
            ctx.fillRect(-w/4, h/4, 4, 6 + legWiggle);
            ctx.fillRect(w/3, h/4, 4, 6 - legWiggle);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-w/2 + 2, 0);
            ctx.quadraticCurveTo(-w/2 - 10, -h/2 - 2, -w/2 - 6, -h/2 - 8);
            ctx.stroke();
        }

        function drawDog(ctx, w, h, color, accentColor, legWiggle) {
            ctx.fillStyle = color;
            ctx.fillRect(-w/2, -h/2, w, h * 0.7);
            ctx.beginPath();
            ctx.arc(w/3, -h/2 + 6, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = accentColor;
            ctx.beginPath();
            ctx.ellipse(w/3 + 5, -h/2 + 9, 5, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(w/3 + 8, -h/2 + 9, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(w/3 - 2, -h/2 + 3, 2.5, 0, Math.PI * 2);
            ctx.arc(w/3 + 6, -h/2 + 3, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(w/3, -h/2 + 4, 1.2, 0, Math.PI * 2);
            ctx.arc(w/3 + 8, -h/2 + 4, 1.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = accentColor;
            ctx.beginPath();
            ctx.ellipse(w/3 - 5, -h/2 - 2, 3, 6, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(w/3 + 10, -h/2 - 2, 3, 6, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = accentColor;
            ctx.fillRect(-w/3, h/3, 4, 6 + legWiggle);
            ctx.fillRect(w/4, h/3, 4, 6 - legWiggle);
            ctx.fillRect(-w/4, h/3, 4, 6 + legWiggle);
            ctx.fillRect(w/3, h/3, 4, 6 - legWiggle);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-w/2, -h/4);
            ctx.quadraticCurveTo(-w/2 - 8, -h/2 - 2, -w/2 - 4, -h/2 - 10);
            ctx.stroke();
        }

        function drawDeer(ctx, w, h, color, accentColor, legWiggle) {
            ctx.fillStyle = color;
            ctx.fillRect(-w/2, -h/4, w, h * 0.5);
            ctx.beginPath();
            ctx.arc(w/3, -h/2 + 4, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(w/3 - 3, -h/2 + 4, 6, 10);
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(w/3 - 2, -h/2 + 2, 2, 0, Math.PI * 2);
            ctx.arc(w/3 + 6, -h/2 + 2, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(w/3, -h/2 + 3, 1.2, 0, Math.PI * 2);

            ctx.lineWidth = 2;
            for (let side of [-1, 1]) {
                const baseX = w/3 + 4 + side * 2;

                ctx.beginPath();
                ctx.moveTo(baseX + side * 5, -h/2 - 8);

                ctx.beginPath();
                ctx.moveTo(baseX + side * 6, -h/2 - 4);

            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-w/3, h/4, 3, 8 + legWiggle);
            ctx.fillRect(w/4, h/4, 3, 8 - legWiggle);

        function drawFox(ctx, w, h, color, accentColor, legWiggle) {

        function drawBear(ctx, w, h, color, accentColor, legWiggle) {

        // ============================================================
        // СОЗДАНИЕ 3D МОДЕЛИ ЖИВОТНОГО
        // ============================================================
        const _animalAssetCache = {};

        function getAnimalAssets(typeId) {
            if (_animalAssetCache[typeId]) return _animalAssetCache[typeId];

            const type = ANIMAL_TYPES[typeId] || ANIMAL_TYPES.DOG;
            const canvas = document.createElement('canvas');
            const size = 128;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size/2;
            const cy = size/2;
            const scale = size/2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = type.width * scale * 1.2;
            const h = type.height * scale * 1.2;
            const color = '#' + type.color.toString(16).padStart(6, '0');
            const accentColor = '#' + type.accentColor.toString(16).padStart(6, '0');
            const legWiggle = 0;

            ctx.save();
            ctx.translate(cx, cy);

            switch (type.design) {
                case 'cat': drawCat(ctx, w, h, color, accentColor, legWiggle); break;
                case 'dog': drawDog(ctx, w, h, color, accentColor, legWiggle); break;
                case 'deer': drawDeer(ctx, w, h, color, accentColor, legWiggle); break;
                case 'boar': drawBoar(ctx, w, h, color, accentColor, legWiggle); break;
                case 'fox': drawFox(ctx, w, h, color, accentColor, legWiggle); break;
                case 'bear': drawBear(ctx, w, h, color, accentColor, legWiggle); break;
                case 'human': drawHuman(ctx, w, h, color, accentColor, legWiggle); break;
            }
            ctx.restore();

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;

            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: true,
                depthWrite: false,
                side: THREE.DoubleSide,
                opacity: 1.0
            });

            const shadowMaterial = new THREE.MeshBasicMaterial({
                color: 0x000000,
                transparent: true,
                opacity: 0.35
            });
            const shadowGeometry = new THREE.CircleGeometry(type.width * 0.55, 8);

            const assets = { type, texture, spriteMaterial, shadowMaterial, shadowGeometry };
            _animalAssetCache[typeId] = assets;
            return assets;
        }

        function createAnimalMesh(typeId) {
            const assets = getAnimalAssets(typeId);
            const type = assets.type;
            const group = new THREE.Group();

            const sprite = new THREE.Sprite(assets.spriteMaterial);
            sprite.scale.set(type.width * 1.2, type.height * 1.2, 1);
            sprite.position.y = type.height * 0.5;
            group.add(sprite);

            const shadow = new THREE.Mesh(assets.shadowGeometry, assets.shadowMaterial);
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.y = 0.02;
            group.add(shadow);

            group.userData = {
                type: typeId,
                sprite: sprite
            };
            return group;
        }

        // ============================================================
        // ЗВУКОВОЙ ДВИЖОК (исправленный)
        // ============================================================
        let soundEngine = null;

        class SoundEngine {
            constructor() {
                this.audioCtx = null;
                this.engineNode = null;
                this.engineGain = null;
                this.isPlaying = false;
                this.engineFrequency = 80;
                this.engineVolume = 0.10;
                this.speed = 0;
                this.maxSpeed = 0.35;
                this.enabled = true;
                this.initialized = false;

                // Музыка
                this.musicGain = null;
                this.musicBuffer = null;
                this.currentMusicSource = null;
                this.isMusicPlaying = false;
                this.musicStarted = false;
                this.musicVolume = 0.55;
                this.engineVolumeMultiplier = 0.6;
                this.musicUrl = 'music/race-music.mp3';
                this.musicLoaded = false;
                this.useProceduralFallback = true;

                this.noiseBuffer = null;
                this.musicNodes = [];
                this.musicInterval = null;

                this._engineId = 0;
                this._isEngineStopping = false;
                this._engineStopTimeout = null;
            }

            init() {
                try {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    console.log('🔊 AudioContext создан:', this.audioCtx.state);

                    // Двигатель
                    this.engineGain = this.audioCtx.createGain();
                    this.engineGain.gain.value = 0;
                    this.engineGain.connect(this.audioCtx.destination);

                    // Музыка
                    this.musicGain = this.audioCtx.createGain();
                    this.musicGain.gain.value = this.musicVolume;
                    this.musicGain.connect(this.audioCtx.destination);

                    this.noiseBuffer = this.createNoiseBuffer();
                    this.enabled = true;
                    this.initialized = true;

                    this.loadMusic();
                    this.createVolumeControls();

                    const resumeAudio = () => {
                        if (this.audioCtx && this.audioCtx.state === 'suspended') {
                            this.audioCtx.resume().then(() => {
                                console.log('🔊 AudioContext resumed');
                                if (!this.isMusicPlaying) this.startMusic();
                            });
                        } else if (!this.isMusicPlaying) {
                            this.startMusic();
                        }
                    };
                    document.addEventListener('click', resumeAudio);
                    document.addEventListener('keydown', resumeAudio);

                    return true;
                } catch (e) {
                    console.warn('⚠️ Аудио не поддерживается:', e);
                    this.enabled = false;
                    return false;
                }
            }

            createNoiseBuffer() {
                if (!this.audioCtx) return null;
                try {
                    const bufferSize = Math.floor(this.audioCtx.sampleRate * 0.2);
                    const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                    }
                    return buffer;
                } catch (e) { return null; }
            }

            createVolumeControls() {
                const old = document.getElementById('volume-controls');
                if (old) old.remove();

                const controls = document.createElement('div');
                controls.id = 'volume-controls';
                
                const status = this.musicLoaded ? '🎵 MP3' : '⏳ Загрузка...';
                
                controls.innerHTML = `
                    <div class="slider-group">
                        <label>🎵 МУЗЫКА</label>
                        <input type="range" id="music-volume" min="0" max="100" value="${Math.round(this.musicVolume * 100)}">
                        <span class="volume-value" id="music-volume-value">${Math.round(this.musicVolume * 100)}%</span>
                        <span id="music-status" style="color:rgba(255,255,255,0.3);font-size:9px;">${status}</span>
                    </div>
                    <div class="slider-group">
                        <label>🏎️ ДВИГАТЕЛЬ</label>
                        <input type="range" id="engine-volume" min="0" max="100" value="${Math.round(this.engineVolumeMultiplier * 100)}">
                        <span class="volume-value" id="engine-volume-value">${Math.round(this.engineVolumeMultiplier * 100)}%</span>
                    </div>
                `;
                document.body.appendChild(controls);

                document.getElementById('music-volume').addEventListener('input', (e) => {
                    const val = parseInt(e.target.value) / 100;
                    this.musicVolume = val;
                    document.getElementById('music-volume-value').textContent = Math.round(val * 100) + '%';
                    if (this.musicGain) {
                        this.musicGain.gain.setValueAtTime(val, this.audioCtx.currentTime);
                    }
                });

                document.getElementById('engine-volume').addEventListener('input', (e) => {
                    const val = parseInt(e.target.value) / 100;
                    this.engineVolumeMultiplier = val;
                    document.getElementById('engine-volume-value').textContent = Math.round(val * 100) + '%';
                });
            }

            async loadMusic() {
                try {
                    console.log('🎵 Загрузка MP3:', this.musicUrl);
                    const response = await fetch(this.musicUrl);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const arrayBuffer = await response.arrayBuffer();
                    this.musicBuffer = await this.audioCtx.decodeAudioData(arrayBuffer);
                    this.musicLoaded = true;
                    
                    console.log(`✅ MP3 загружен (${this.musicBuffer.duration.toFixed(1)} сек)`);
                    
                    const statusEl = document.getElementById('music-status');
                    if (statusEl) statusEl.textContent = '🎵 MP3';
                    
                    if (this.musicStarted && !this.isMusicPlaying) {
                        this.startMusic();
                    }
                    return true;
                } catch (e) {
                    console.warn('⚠️ MP3 не найден:', e.message);
                    console.warn('💡 Положите файл в music/race-music.mp3 или будет procedural');
                    
                    this.musicBuffer = null;
                    this.musicLoaded = false;
                    
                    const statusEl = document.getElementById('music-status');
                    if (statusEl) statusEl.textContent = this.useProceduralFallback ? '🎹 Procedural' : '❌ Нет MP3';
                    
                    return false;
                }
            }

            startMusic() {
                if (!this.enabled || !this.audioCtx || this.isMusicPlaying) return;

                this.musicStarted = true;

                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume().then(() => this._playMusic());
                } else {
                    this._playMusic();
                }
            }

            _playMusic() {
                if (this.isMusicPlaying) return;

                // 1. Пробуем MP3
                if (this.musicBuffer && this.musicLoaded) {
                    this._playMp3Loop();
                    return;
                }

                // 2. Fallback — процедурная музыка
                if (this.useProceduralFallback) {
                    console.log('🎹 Запуск процедурной музыки');
                    this.isMusicPlaying = true;
                    this.playProceduralLoop();
                    this.musicInterval = setInterval(() => this.playProceduralLoop(), 4800);
                    return;
                }

                // Ждём загрузку MP3
                setTimeout(() => {
                    if (!this.isMusicPlaying) this._playMusic();
                }, 800);
            }

            _playMp3Loop() {
                if (!this.musicBuffer) return;

                // Останавливаем предыдущий
                if (this.currentMusicSource) {
                    try { this.currentMusicSource.stop(); } catch(e) {}
                }

                const source = this.audioCtx.createBufferSource();
                source.buffer = this.musicBuffer;
                source.loop = true;
                source.connect(this.musicGain);
                source.start(0);

                this.currentMusicSource = source;
                this.isMusicPlaying = true;
                console.log('🎵 MP3 loop запущен');
            }

            playProceduralLoop() {
                if (!this.enabled || !this.audioCtx || !this.isMusicPlaying) return;
                try {
                    const t0 = this.audioCtx.currentTime + 0.05;
                    const melody = [
                        [523,0.14],[587,0.14],[659,0.14],[784,0.14],
                        [659,0.14],[587,0.14],[523,0.14],[659,0.14],
                        [784,0.14],[880,0.14],[784,0.14],[659,0.14],
                        [880,0.14],[988,0.14],[880,0.14],[784,0.14]
                    ];
                    const bass = [
                        [130,0.28],[130,0.28],[146,0.28],[146,0.28],
                        [164,0.28],[164,0.28],[146,0.28],[146,0.28]
                    ];

                    let t = 0;
                    melody.forEach(([freq, dur]) => {
                        const osc = this.audioCtx.createOscillator();
                        const g = this.audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.value = freq;
                        g.gain.setValueAtTime(0.04, t0 + t);
                        g.gain.exponentialRampToValueAtTime(0.001, t0 + t + dur);
                        osc.connect(g);
                        g.connect(this.musicGain);
                        osc.start(t0 + t);
                        osc.stop(t0 + t + dur + 0.02);
                        this.musicNodes.push(osc);
                        t += dur + 0.015;
                    });

                    t = 0;
                    bass.forEach(([freq, dur]) => {
                        const osc = this.audioCtx.createOscillator();
                        const g = this.audioCtx.createGain();
                        osc.type = 'square';
                        osc.frequency.value = freq;
                        g.gain.setValueAtTime(0.028, t0 + t);
                        g.gain.exponentialRampToValueAtTime(0.001, t0 + t + dur);
                        osc.connect(g);
                        g.connect(this.musicGain);
                        osc.start(t0 + t);
                        osc.stop(t0 + t + dur + 0.02);
                        this.musicNodes.push(osc);
                        t += dur + 0.015;
                    });
                } catch (e) {
                    console.warn('Ошибка procedural:', e);
                }
            }

            stopMusic() {
                this.isMusicPlaying = false;
                this.musicStarted = false;

                if (this.musicInterval) {
                    clearInterval(this.musicInterval);
                    this.musicInterval = null;
                }
                if (this.currentMusicSource) {
                    try { this.currentMusicSource.stop(); } catch(e) {}
                    this.currentMusicSource = null;
                }
                this.musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
                this.musicNodes = [];

                if (this.musicGain) {
                    try { this.musicGain.gain.setValueAtTime(0, this.audioCtx.currentTime); } catch(e) {}
                }
            }

            // ========== ДВИГАТЕЛЬ ==========
            update(speed) {
                if (!this.enabled || !this.audioCtx || !this.initialized) return;
                this.speed = speed;

                const normalized = Math.abs(speed) / this.maxSpeed;
                const targetFreq = 55 + normalized * 180;
                const targetVol = (0.015 + normalized * 0.14) * this.engineVolumeMultiplier;

                if (Math.abs(speed) > 0.01) {
                    if (this._engineStopTimeout) {
                        clearTimeout(this._engineStopTimeout);
                        this._engineStopTimeout = null;
                        this._isEngineStopping = false;
                    }
                    if (!this.isPlaying) this.startEngine();

                    this.engineFrequency += (targetFreq - this.engineFrequency) * 0.15;
                    this.engineVolume += (targetVol - this.engineVolume) * 0.15;

                    if (this.engineNode && this.engineGain) {
                        try {
                            this.engineNode.frequency.setValueAtTime(this.engineFrequency, this.audioCtx.currentTime);
                            this.engineGain.gain.setValueAtTime(this.engineVolume, this.audioCtx.currentTime);
                        } catch (e) {
                            this.restartEngine();
                        }
                    }
                } else {
                    if (this.isPlaying) this.stopEngineSmooth();
                }
            }

            startEngine() {
                if (this.isPlaying || this._isEngineStopping) return;
                if (!this.enabled || !this.audioCtx) return;

                try {
                    this._engineId++;
                    const id = this._engineId;

                    const osc = this.audioCtx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.value = this.engineFrequency;
                    osc.connect(this.engineGain);
                    this.engineGain.gain.setValueAtTime(this.engineVolume, this.audioCtx.currentTime);
                    osc.start();

                    this.engineNode = osc;
                    this.isPlaying = true;
                    this._isEngineStopping = false;

                    osc.onended = () => {
                        if (this.isPlaying && this._engineId === id) this.restartEngine();
                    };
                } catch (e) {
                    this.engineNode = null;
                    this.isPlaying = false;
                }
            }

            stopEngineSmooth() {
                if (this._isEngineStopping || !this.isPlaying || !this.engineNode) return;
                this._isEngineStopping = true;

                try {
                    this.engineGain.gain.setValueAtTime(Math.max(0.0001, this.engineVolume), this.audioCtx.currentTime);
                    this.engineGain.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + 0.15);
                } catch(e) {}

                const id = this._engineId;
                this._engineStopTimeout = setTimeout(() => {
                    if (this._engineId === id) this._stopEngineNow();
                    this._engineStopTimeout = null;
                }, 180);
            }

            _stopEngineNow() {
                try {
                    if (this.engineNode) {
                        this.engineNode.stop();
                        this.engineNode.disconnect();
                    }
                } catch(e) {}
                this.engineNode = null;
                this.isPlaying = false;
                this._isEngineStopping = false;
                if (this.engineGain) {
                    try { this.engineGain.gain.setValueAtTime(0, this.audioCtx.currentTime); } catch(e) {}
                }
            }

            restartEngine() {
                this._stopEngineNow();
                setTimeout(() => this.startEngine(), 30);
            }

            playFinishSound() {
                if (!this.enabled || !this.audioCtx) return;
                try {
                    [523, 659, 784, 1047].forEach((freq, i) => {
                        const osc = this.audioCtx.createOscillator();
                        const g = this.audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        g.gain.setValueAtTime(0.12, this.audioCtx.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + i * 0.1 + 0.3);
                        osc.connect(g);
                        g.connect(this.audioCtx.destination);
                        osc.start(this.audioCtx.currentTime + i * 0.1);
                        osc.stop(this.audioCtx.currentTime + i * 0.1 + 0.3);
                    });
                } catch(e) {}
            }

            playCrashSound(volumeScale = 1) {
                if (!this.enabled || !this.audioCtx) return;
                try {
                    const t0 = this.audioCtx.currentTime;
                    const thud = this.audioCtx.createOscillator();
                    const g = this.audioCtx.createGain();
                    thud.type = 'triangle';
                    thud.frequency.setValueAtTime(140, t0);
                    thud.frequency.exponentialRampToValueAtTime(30, t0 + 0.3);
                    g.gain.setValueAtTime(0.35 * volumeScale, t0);
                    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
                    thud.connect(g);
                    g.connect(this.audioCtx.destination);
                    thud.start(t0);
                    thud.stop(t0 + 0.32);

                    if (this.noiseBuffer) {
                        const noise = this.audioCtx.createBufferSource();
                        noise.buffer = this.noiseBuffer;
                        const ng = this.audioCtx.createGain();
                        ng.gain.setValueAtTime(0.16 * volumeScale, t0);
                        ng.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
                        noise.connect(ng);
                        ng.connect(this.audioCtx.destination);
                        noise.start(t0);
                    }
                } catch(e) {}
            }

            dispose() {
                this.stopMusic();
                this._stopEngineNow();
                if (this.audioCtx) {
                    try { this.audioCtx.close(); } catch(e) {}
                }
            }
        }

        // ============================================================
        // AnimalSpawner
        // ============================================================
        class AnimalSpawner {
            constructor(scene, roadWidth, roadCenter, finishZ, triggerLookahead, maxAnimals, spawnRate) {
                this.scene = scene;
                this.roadWidth = roadWidth;
                this.roadCenter = roadCenter;
                this.finishZ = finishZ;
                this.triggerLookahead = triggerLookahead;
                this.animals = [];
                this.spawnTimer = 0;
                this.minSpawnInterval = spawnRate * 0.6;
                this.maxSpawnInterval = spawnRate * 1.4;
                this.nextSpawnTime = this.getRandomInterval();
                this.totalSpawned = 0;
                this.maxAnimals = maxAnimals;
                this.enabled = true;
                
                this.mandatoryPool = [];
                this.speciesCount = {};
                ANIMAL_KEYS.forEach(key => { this.speciesCount[key] = 0; });
                
                this.buildMandatoryPool();
                this.shufflePool();
            }

            buildMandatoryPool() {
                const mandatory = [
                    { type: 'DOG', count: 4 }, { type: 'HUMAN', count: 5 },
                    { type: 'DEER', count: 3 }, { type: 'BEAR', count: 4 },
                    { type: 'CAT', count: 4 }, { type: 'FOX', count: 3 }, { type: 'BOAR', count: 3 }
                ];
                this.mandatoryPool = [];
                mandatory.forEach(item => {
                    for (let i = 0; i < item.count; i++) this.mandatoryPool.push(item.type);
                });
            }

            shufflePool() {
                for (let i = this.mandatoryPool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.mandatoryPool[i], this.mandatoryPool[j]] = [this.mandatoryPool[j], this.mandatoryPool[i]];
                }
            }

            getRandomInterval() {
                return Math.random() * (this.maxSpawnInterval - this.minSpawnInterval) + this.minSpawnInterval;
            }

            getNextSpecies() {
                if (this.mandatoryPool.length > 0) {
                    return this.mandatoryPool.pop();
                }
                return ANIMAL_KEYS[Math.floor(Math.random() * ANIMAL_KEYS.length)];
            }

            createAnimal(z, forcedType = null) {
                const typeId = forcedType || this.getNextSpecies();
                const type = ANIMAL_TYPES[typeId];
                const mesh = createAnimalMesh(typeId);

                const fromLeft = Math.random() < 0.5;
                const startX = fromLeft ? -(this.roadWidth / 2 + 1.5) : (this.roadWidth / 2 + 1.5);
                const endX = -startX;
                if (!fromLeft) mesh.scale.x = -1;
                
                const scale = 0.8 + Math.random() * 0.5;
                mesh.scale.set(scale, scale, scale);
                
                mesh.position.set(startX, 0, z);
                mesh.visible = false;
                this.scene.add(mesh);

                return {
                    type: 'animal',
                    speciesKey: typeId,
                    speciesId: type.id,
                    animalType: typeId,
                    mesh: mesh,
                    z: z,
                    x: startX,
                    startX: startX,
                    endX: endX,
                    duration: 0.6 + Math.random() * 0.4,
                    elapsed: 0,
                    triggered: false,
                    aliveTime: 0,
                    radius: type.radius * scale || 0.5,
                    penalty: type.penalty || 0.35,
                    timePenalty: type.timePenalty || 4,
                    speedZ: type.speedZ || 0.02,
                    speedCross: type.speedCross || 3.0,
                    direction: fromLeft ? 1 : -1,
                    hit: false
                };
            }

            update(deltaTime, playerZ) {
                if (!this.enabled || playerZ < this.finishZ) return;

                this.spawnTimer += deltaTime;
                const totalActive = this.animals.length;

                if (this.spawnTimer >= this.nextSpawnTime && totalActive < this.maxAnimals) {
                    this.spawnTimer = 0;
                    this.nextSpawnTime = this.getRandomInterval();

                    const spawnZ = playerZ - 12 - Math.random() * 8;
                    if (spawnZ > this.finishZ) {
                        const typeId = this.getNextSpecies();
                        const animal = this.createAnimal(spawnZ, typeId);
                        this.animals.push(animal);
                        this.totalSpawned++;
                        this.speciesCount[typeId] = (this.speciesCount[typeId] || 0) + 1;
                    }
                }

                for (let i = this.animals.length - 1; i >= 0; i--) {
                    const animal = this.animals[i];
                    this.updateAnimal(animal, deltaTime, playerZ);
                    if (animal.triggered) animal.aliveTime += deltaTime;

                    const staleTimeout = animal.aliveTime > 12;
                    if (animal.z > playerZ + 30 || animal.hit || staleTimeout || animal.z < playerZ - 150) {
                        this.disposeAnimal(animal);
                        if (animal.speciesKey) {
                            this.speciesCount[animal.speciesKey] = Math.max(0, (this.speciesCount[animal.speciesKey] || 0) - 1);
                        }
                        this.animals.splice(i, 1);
                    }
                }
            }

            updateAnimal(animal, deltaTime, playerZ) {
                if (!animal.triggered) {
                    const distanceAhead = playerZ - animal.z;
                    if (distanceAhead > 0.5 && distanceAhead <= this.triggerLookahead) {
                        animal.triggered = true;
                        animal.mesh.visible = true;
                    }
                    if (distanceAhead < -5) {
                        animal.hit = true;
                    }
                    return;
                }

                if (animal.elapsed < animal.duration) {
                    animal.elapsed += deltaTime;
                    const t = Math.min(animal.elapsed / animal.duration, 1);
                    const easedT = t * t * (3 - 2 * t);
                    animal.x = animal.startX + (animal.endX - animal.startX) * easedT;
                    animal.mesh.position.x = animal.x;
                }

                const zMove = animal.speedZ || 0.02;
                animal.z -= zMove * 60 * deltaTime * 0.3;
                animal.mesh.position.z = animal.z;
            }

            disposeAnimal(animal) {
                this.scene.remove(animal.mesh);
            }

            getActiveAnimals() {
                return this.animals.filter(a => a.triggered && !a.hit);
            }

            clear() {
                this.animals.forEach(a => this.disposeAnimal(a));
                this.animals = [];
                this.totalSpawned = 0;
                ANIMAL_KEYS.forEach(key => { this.speciesCount[key] = 0; });
                this.buildMandatoryPool();
                this.shufflePool();
            }

            getStats() {
                const species = {};
                ANIMAL_KEYS.forEach(key => {
                    species[key] = this.speciesCount[key] || 0;
                });
                return {
                    total: this.totalSpawned,
                    active: this.animals.length,
                    triggered: this.animals.filter(a => a.triggered && !a.hit).length,
                    species: species,
                    remainingInPool: this.mandatoryPool.length
                };
            }
        }

            // ============================================================

            // ============================================================
            function showEndScreen(state, timeTaken) {
                const screen = document.createElement('div');
                screen.id = 'finish-screen';
                screen.style.cssText = `
                    position: absolute; top: 0; left: 0; width: 100%; height: 100%;

                `;

                let title, color, message, isBest = false;
                
                if (state === 'win') {
                    const bestTimes = getBestTimes();
                    const isNewBest = saveBestTime(difficulty, timeTaken);
                    isBest = isNewBest;
                    
                    title = strikes === 0 ? '🏆 ИДЕАЛЬНЫЙ ЗАЕЗД!' : '🏁 ФИНИШ!';

                    if (bestTimes[difficulty] !== null) {
                        message += `\n🏆 Лучшее: ${formatTime(bestTimes[difficulty])}`;
                    }
                } else if (state === 'timeout') {
                    title = '⏰ ВРЕМЯ ВЫШЛО!';
                    color = '#ff6644';
                    message = `Не удалось доехать за ${TIME_LIMIT} секунд`;

                        <button onclick="location.reload()" style="padding:12px 30px;border:2px solid ${color};border-radius:10px;background:rgba(255,255,255,0.05);color:#fff;font-size:16px;cursor:pointer;margin-top:15px;">
                            🔄 Заново

                        <div style="margin-top:10px;font-size:12px;color:#666;">Нажмите R для рестарта</div>

                `;
                document.body.appendChild(screen);
            }

            function endGame(state) {
                if (gameState !== 'racing') return;
                gameState = state;
                try { soundEngine.stopEngineSmooth(); } catch(e) {}
                try { soundEngine._stopEngineNow(); } catch(e) {}
                try { soundEngine.stopMusic(); } catch(e) {}
                document.removeEventListener('keydown', keydownHandler);
                document.removeEventListener('keyup', keyupHandler);
                window.removeEventListener('resize', resizeHandler);
                
                const mobileControls = document.getElementById('mobile-controls');
                if (mobileControls) mobileControls.classList.remove('active');
                
                const hud = document.getElementById('game-hud');
                if (hud) hud.remove();
                const timeTaken = raceTime;
                setTimeout(() => {
                    showEndScreen(state, timeTaken);
                    // Optionally cancel further animation after screen shows
                    if (animationId) {
                        // keep rendering for a while, no need to cancel hard
                    }
                }, state === 'crash' ? 350 : 500);
            }

            // ============================================================
            // СЦЕНА
            // ============================================================
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x4a8db7);
            scene.fog = new THREE.Fog(0x4a8db7, FOG_NEAR, 180);

            const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);

            // ============================================================

            // ============================================================

            // ============================================================
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            const pixelRatio = quality === 'high' ? 2 : quality === 'medium' ? 1.5 : 1;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, pixelRatio));
            renderer.shadowMap.enabled = true;
