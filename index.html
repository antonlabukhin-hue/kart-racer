            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // ============================================================
            // ТЕКСТУРЫ
            // ============================================================
            function createGrassTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#3a8a3a';
                ctx.fillRect(0, 0, 128, 128);
                for (let i = 0; i < 500; i++) {
                    const x = Math.random() * 128;
                    const y = Math.random() * 128;
                    const len = 2 + Math.random() * 4;
                    const shade = 40 + Math.random() * 80;
                    ctx.strokeStyle = `rgb(${shade}, ${shade + 60}, ${shade - 20})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + (Math.random() - 0.5) * len, y + len);
                    ctx.stroke();
                }
                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(80, 80);
                return texture;
            }

            function createAsphaltTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#444455';
                ctx.fillRect(0, 0, 128, 128);
                for (let i = 0; i < 300; i++) {
                    const x = Math.random() * 128;
                    const y = Math.random() * 128;
                    const sz = 1 + Math.random() * 2;
                    const shade = 50 + Math.random() * 80;
                    ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade + 10})`;
                    ctx.fillRect(x, y, sz, sz);
                }
                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(1, 120);
                return texture;
            }

            // ============================================================
            // ЗЕМЛЯ И ТРАССА
            // ============================================================
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(400, TRACK_LENGTH + 200),
                new THREE.MeshStandardMaterial({ map: createGrassTexture(), roughness: 1, metalness: 0 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.05;
            ground.receiveShadow = true;
            scene.add(ground);

            const trackMat = new THREE.MeshStandardMaterial({
                map: createAsphaltTexture(),
                roughness: 0.75,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            const track = new THREE.Mesh(new THREE.PlaneGeometry(TRACK_WIDTH, TRACK_LENGTH), trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.set(0, 0.01, 0);
            track.receiveShadow = true;
            scene.add(track);

            // ============================================================
            // РАЗМЕТКА - ОПТИМИЗИРОВАННАЯ (INSTANCED MESH)
            // ============================================================
            function createLaneMarkings() {
                const geo = new THREE.PlaneGeometry(0.1, 0.8);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0xffffff, 
                    emissive: 0x88aaff, 
                    emissiveIntensity: 0.05, 
                    side: THREE.DoubleSide, 
                    roughness: 0.3 
                });
                const spots = [];
                const spacing = quality === 'low' ? 4.0 : quality === 'medium' ? 3.0 : 2.5;
                for (let lane = 1; lane < TOTAL_LANES; lane++) {
                    const xMark = -TRACK_WIDTH / 2 + lane * LANE_WIDTH;
                    for (let i = -TRACK_LENGTH / 2 + 0.5; i < TRACK_LENGTH / 2 - 0.5; i += spacing) {
                        spots.push({ x: xMark, z: i });
                    }
                }
                const mesh = new THREE.InstancedMesh(geo, mat, spots.length);
                const dummy = new THREE.Object3D();
                dummy.rotation.x = -Math.PI / 2;
                spots.forEach((p, idx) => {
                    dummy.position.set(p.x, 0.02, p.z);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(idx, dummy.matrix);
                });
                mesh.instanceMatrix.needsUpdate = true;
                mesh.castShadow = false;
                mesh.receiveShadow = false;
                scene.add(mesh);
                return mesh;
            }
            createLaneMarkings();

            // ============================================================
            // БОРДЮРЫ - ОПТИМИЗИРОВАННЫЕ (INSTANCED MESH)
            // ============================================================
            function createCurbs() {
                const geo = new THREE.BoxGeometry(0.15, 0.06, 0.35);
                const spots = [];
                const spacing = quality === 'low' ? 1.8 : quality === 'medium' ? 1.5 : 1.2;
                for (let i = -TRACK_LENGTH / 2; i <= TRACK_LENGTH / 2; i += spacing) {
                    for (const side of [-1, 1]) {
                        spots.push({ 
                            x: side * (TRACK_WIDTH / 2 + 0.15), 
                            z: i, 
                            isRed: Math.floor(i * 2) % 2 === 0 
                        });
                    }
                }
                const mat1 = new THREE.MeshStandardMaterial({ color: 0xff2200, roughness: 0.4, emissive: 0xff0000, emissiveIntensity: 0.05 });
                const mat2 = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
                const redSpots = spots.filter(s => s.isRed);
                const whiteSpots = spots.filter(s => !s.isRed);
                const mesh1 = new THREE.InstancedMesh(geo, mat1, redSpots.length);
                const mesh2 = new THREE.InstancedMesh(geo, mat2, whiteSpots.length);
                const dummy = new THREE.Object3D();
                let idx1 = 0, idx2 = 0;
                spots.forEach(p => {
                    dummy.position.set(p.x, 0.03, p.z);
                    dummy.updateMatrix();
                    const mesh = p.isRed ? mesh1 : mesh2;
                    const idx = p.isRed ? idx1++ : idx2++;
                    mesh.setMatrixAt(idx, dummy.matrix);
                });
                mesh1.instanceMatrix.needsUpdate = true;
                mesh2.instanceMatrix.needsUpdate = true;
                mesh1.castShadow = false;
                mesh2.castShadow = false;
                mesh1.receiveShadow = false;
                mesh2.receiveShadow = false;
                if (idx1 > 0) scene.add(mesh1);
                if (idx2 > 0) scene.add(mesh2);
            }
            createCurbs();

            // ============================================================
            // СТАРТ / ФИНИШ
            // ============================================================
            const startLine = new THREE.Mesh(
                new THREE.PlaneGeometry(TRACK_WIDTH - 0.5, 0.4),
                new THREE.MeshStandardMaterial({ color: 0xffdd00, emissive: 0xff8800, emissiveIntensity: 0.3, side: THREE.DoubleSide })
            );
            startLine.rotation.x = -Math.PI / 2;
            startLine.position.set(0, 0.02, TRACK_LENGTH / 2 - 5);
            scene.add(startLine);

            for (let i = -TRACK_WIDTH / 2 + 0.3; i < TRACK_WIDTH / 2 - 0.3; i += 0.35) {
                const flag = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.2, 0.2),
                    new THREE.MeshStandardMaterial({ color: (Math.floor(i * 4) % 2 === 0) ? 0xffffff : 0x000000, side: THREE.DoubleSide })
                );
                flag.rotation.x = -Math.PI / 2;
                flag.position.set(i, 0.02, -TRACK_LENGTH / 2 + 5);
                scene.add(flag);
            }

            // ============================================================
            // НОЧНАЯ ЗОНА
            // ============================================================
            const NIGHT_ZONE_START = HAS_NIGHT_ZONE ? TRACK_LENGTH * 0.3 : 9999;
            const NIGHT_ZONE_END = HAS_NIGHT_ZONE ? TRACK_LENGTH * 0.55 : 9999;
            
            const nightOverlay = new THREE.Mesh(
                new THREE.PlaneGeometry(TRACK_WIDTH + 10, HAS_NIGHT_ZONE ? 200 : 1),
                new THREE.MeshBasicMaterial({
                    color: 0x000022,
                    transparent: true,
                    opacity: 0,
                    side: THREE.DoubleSide,
                    depthWrite: false
                })
            );
            nightOverlay.rotation.x = -Math.PI / 2;
            nightOverlay.position.set(0, 0.02, -(NIGHT_ZONE_START + NIGHT_ZONE_END) / 2);
            scene.add(nightOverlay);

            // ============================================================
            // ДЕРЕВЬЯ
            // ============================================================
            function createTree(x, z, scale = 1) {
                const group = new THREE.Group();
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.06 * scale, 0.12 * scale, 0.5 * scale, 6),
                    new THREE.MeshStandardMaterial({ color: 0x5a3d2b, roughness: 0.9 })
                );
                trunk.position.y = 0.25 * scale;
                trunk.castShadow = true;
                group.add(trunk);
                const colors = [0x2d7d2d, 0x3a8c3a, 0x4a9a4a, 0x5a8a3a];
                const crownCount = quality === 'low' ? 2 : 3;
                for (let i = 0; i < crownCount; i++) {
                    const crown = new THREE.Mesh(
                        new THREE.SphereGeometry((0.2 + Math.random() * 0.2) * scale, 6),
                        new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], roughness: 0.8 })
                    );
                    crown.position.set((Math.random() - 0.5) * 0.4 * scale, 0.5 * scale + Math.random() * 0.3 * scale, (Math.random() - 0.5) * 0.4 * scale);
                    crown.castShadow = true;
                    group.add(crown);
                }
                group.position.set(x, 0, z);
                scene.add(group);
            }

            const treeCount = quality === 'low' ? Math.min(15, config.trees) : 
                             quality === 'medium' ? config.trees : config.trees * 1.3;
            for (let i = 0; i < treeCount; i++) {
                const z = -TRACK_LENGTH / 2 + Math.random() * TRACK_LENGTH;
                const side = Math.random() > 0.5 ? 1 : -1;
                const x = side * (TRACK_WIDTH / 2 + 2 + Math.random() * 5);
                const scale = 0.6 + Math.random() * 0.8;
                createTree(x, z, scale);
            }

            // ============================================================
            // МАШИНА ИГРОКА
            // ============================================================
            function createCar(color = 0xff3333, isPlayer = false) {
                const car = new THREE.Group();
                
                // Основной кузов
                const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.18, metalness: 0.75 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.22, 1.45), bodyMat);
                body.position.y = 0.22;
                body.castShadow = true;
                body.receiveShadow = true;
                car.add(body);

                // Кабина
                const cabinMat = new THREE.MeshStandardMaterial({ 
                    color: isPlayer ? 0x88ddff : 0x88ccff, 
                    roughness: 0.05, 
                    metalness: 0.3, 
                    transparent: true, 
                    opacity: 0.75 
                });
                const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.18, 0.55), cabinMat);
                cabin.position.set(0, 0.40, 0.05);
                cabin.castShadow = true;
                car.add(cabin);

                // Фары
                const lightMat = new THREE.MeshStandardMaterial({ 
                    color: 0xffffaa, 
                    emissive: 0xffff66, 
                    emissiveIntensity: isPlayer ? 1.2 : 0.7 
                });
                const l1 = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10), lightMat);
                l1.position.set(-0.22, 0.16, -0.72);
                car.add(l1);
                const l2 = l1.clone();
                l2.position.x = 0.22;
                car.add(l2);

                // Задние фонари
                const tailLightMat = new THREE.MeshStandardMaterial({ 
                    color: 0xff2222, 
                    emissive: 0xff0000, 
                    emissiveIntensity: 0.6 
                });
                const tl1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.04), tailLightMat);
                tl1.position.set(-0.28, 0.22, 0.72);
                car.add(tl1);
                const tl2 = tl1.clone();
                tl2.position.x = 0.28;
                car.add(tl2);

                // Тень
                const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32 });
                const shadowGeo = new THREE.PlaneGeometry(1.05, 1.7);
                const fakeShadow = new THREE.Mesh(shadowGeo, shadowMat);
                fakeShadow.rotation.x = -Math.PI / 2;
                fakeShadow.position.y = 0.015;
                car.add(fakeShadow);

                // Колёса
                const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.95 });
                const rimMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.3 });
                const wheelPos = [
                    [-0.38, 0.07, 0.52], [0.38, 0.07, 0.52],
                    [-0.38, 0.07, -0.52], [0.38, 0.07, -0.52]
                ];
                wheelPos.forEach(p => {
                    const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.07, 10), tireMat);
                    tire.rotation.z = Math.PI / 2;
                    tire.position.set(p[0], p[1], p[2]);
                    tire.castShadow = true;
                    car.add(tire);
                    
                    // Диск
                    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.075, 8), rimMat);
                    rim.rotation.z = Math.PI / 2;
                    rim.position.set(p[0], p[1], p[2]);
                    car.add(rim);
                });

                // === УЛУЧШЕНИЯ ТОЛЬКО ДЛЯ ИГРОКА ===
                if (isPlayer) {
                    // Спойлер
                    const spoilerMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.6 });
                    const spoilerBase = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.12), spoilerMat);
                    spoilerBase.position.set(0, 0.38, 0.68);
                    car.add(spoilerBase);
                    
                    const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.03, 0.18), spoilerMat);
                    spoilerWing.position.set(0, 0.48, 0.70);
                    spoilerWing.rotation.x = -0.25;
                    car.add(spoilerWing);
                    
                    // Стойки спойлера
                    const strutGeo = new THREE.BoxGeometry(0.03, 0.12, 0.03);
                    const strut1 = new THREE.Mesh(strutGeo, spoilerMat);
                    strut1.position.set(-0.25, 0.42, 0.68);
                    car.add(strut1);
                    const strut2 = strut1.clone();
                    strut2.position.x = 0.25;
                    car.add(strut2);

                    // Выхлопные трубы (двойные)
                    const exhaustMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.25 });
                    const pipeGeo = new THREE.CylinderGeometry(0.035, 0.04, 0.18, 8);
                    
                    const pipe1 = new THREE.Mesh(pipeGeo, exhaustMat);
                    pipe1.rotation.x = Math.PI / 2;
                    pipe1.position.set(-0.18, 0.08, 0.78);
                    car.add(pipe1);
                    
                    const pipe2 = pipe1.clone();
                    pipe2.position.x = 0.18;
                    car.add(pipe2);
                    
                    // Кончики труб (хром)
                    const tipMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1.0, roughness: 0.1 });
                    const tip1 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.038, 0.04, 8), tipMat);
                    tip1.rotation.x = Math.PI / 2;
                    tip1.position.set(-0.18, 0.08, 0.88);
                    car.add(tip1);
                    const tip2 = tip1.clone();
                    tip2.position.x = 0.18;
                    car.add(tip2);

                    // Передний бампер / сплиттер
                    const splitterMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.4 });
                    const splitter = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.04, 0.12), splitterMat);
                    splitter.position.set(0, 0.06, -0.72);
                    car.add(splitter);

                    // Боковые юбки
                    const skirtGeo = new THREE.BoxGeometry(0.06, 0.06, 1.1);
                    const skirt1 = new THREE.Mesh(skirtGeo, splitterMat);
                    skirt1.position.set(-0.42, 0.08, 0);
                    car.add(skirt1);
                    const skirt2 = skirt1.clone();
                    skirt2.position.x = 0.42;
                    car.add(skirt2);

                    // Капот с воздухозаборником
                    const hoodScoop = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.06, 0.3), spoilerMat);
                    hoodScoop.position.set(0, 0.36, -0.25);
                    car.add(hoodScoop);

                    // Номер / полоса
                    const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
                    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.01, 1.3), stripeMat);
                    stripe.position.set(0, 0.335, 0);
                    car.add(stripe);
                }

                return car;
            }

            const playerCar = createCar(0xff2200, true);
            let zPos = START_Z;
            let xPos = 0;
            let xVelocity = 0;
            playerCar.position.set(xPos, 0.1, zPos);
            scene.add(playerCar);

            // ============================================================
            // ПОПУТНЫЕ МАШИНЫ
            // ============================================================
            const cars = [];
            const carColors = [0x3366ff, 0x33cc33, 0xffff00, 0xcc00ff, 0xff6600, 0x00ccff, 0xff33cc];
            
            function createOpponentCar(z, lane) {
                const car = new THREE.Group();
                const color = carColors[Math.floor(Math.random() * carColors.length)];
                
                const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.5 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 1.4), bodyMat);
                body.position.y = 0.2;
                body.castShadow = true;
                body.receiveShadow = true;
                car.add(body);
                
                const cabin = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.16, 0.5),
                    new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.05, metalness: 0.3, transparent: true, opacity: 0.7 })
                );
                cabin.position.set(0, 0.38, 0.05);
                car.add(cabin);
                
                const lightMat2 = new THREE.MeshStandardMaterial({ color: 0xffff88, emissive: 0xffff44, emissiveIntensity: 0.5 });
                const l1b = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8), lightMat2);
                l1b.position.set(-0.2, 0.14, -0.7);
                car.add(l1b);
                const l2b = l1b.clone();
                l2b.position.x = 0.2;
                car.add(l2b);
                
                const x = -TRACK_WIDTH / 2 + 0.5 + lane * 2;
                car.position.set(x, 0.1, z);
                scene.add(car);
                
                const speed = 0.01 + Math.random() * 0.025;
                return { mesh: car, x: x, z: z, lane: lane, speed: speed, active: true, laneChangeTimer: 2 + Math.random() * 4, targetLane: lane, isChangingLane: false, laneChangeProgress: 0, hitCooldown: 0 };
            }

            const maxCars = quality === 'low' ? Math.min(12, config.maxCars) : config.maxCars;
            for (let i = 0; i < maxCars; i++) {
                const z = -TRACK_LENGTH / 2 + 20 + Math.random() * (TRACK_LENGTH - 60);
                const lane = Math.floor(Math.random() * 3);
                cars.push(createOpponentCar(z, lane));
            }

            // ============================================================
            // ПРЕПЯТСТВИЯ
            // ============================================================
            const obstacles = [];
            const maxObstacles = quality === 'low' ? Math.min(15, config.maxObstacles) : config.maxObstacles;
            
            function createObstacle(z, type) {
                const group = new THREE.Group();
                let mesh;
                
                if (type === 'pothole') {
                    mesh = new THREE.Mesh(
                        new THREE.CircleGeometry(0.4, 16),
                        new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.9, metalness: 0.1 })
                    );
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.y = 0.015;
                    
                    const rim = new THREE.Mesh(
                        new THREE.RingGeometry(0.4, 0.45, 16),
                        new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.8 })
                    );
                    rim.rotation.x = -Math.PI / 2;
                    rim.position.y = 0.018;
                    group.add(rim);
                } else {
                    const bumpMat = new THREE.MeshStandardMaterial({ color: 0x555544, roughness: 0.8 });
                    mesh = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.4, 0.4, 0.08, 16),
                        bumpMat
                    );
                    mesh.position.y = 0.04;
                    mesh.receiveShadow = true;
                    mesh.castShadow = true;
                }
                
                group.add(mesh);
                
                const x = -TRACK_WIDTH / 2 + 0.5 + Math.floor(Math.random() * 3) * 2;
                group.position.set(x, 0, z);
                scene.add(group);
                
                return { mesh: group, x: x, z: z, type: type, active: true };
            }

            for (let i = 0; i < maxObstacles; i++) {
                const z = -TRACK_LENGTH / 2 + 30 + Math.random() * (TRACK_LENGTH - 80);
                const type = Math.random() < 0.5 ? 'pothole' : 'bump';
                obstacles.push(createObstacle(z, type));
            }

            // ============================================================
            // МОБИЛЬНОЕ УПРАВЛЕНИЕ
            // ============================================================
            const mobileControls = document.getElementById('mobile-controls');
            if (isMobile) {
                mobileControls.classList.add('active');
            }

            const btnGas = document.getElementById('btnGas');
            const btnBrake = document.getElementById('btnBrake');
            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');
            
            function setupMobileButton(el, onStart, onEnd) {
                if (!el) return;
                
                const start = (e) => {
                    e.preventDefault();
                    el.classList.add('active');
                    if (onStart) onStart();
                };
                const end = (e) => {
                    e.preventDefault();
                    el.classList.remove('active');
                    if (onEnd) onEnd();
                };
                
                el.addEventListener('touchstart', start, { passive: false });
                el.addEventListener('touchend', end, { passive: false });
                el.addEventListener('touchcancel', end, { passive: false });
                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', end);
                el.addEventListener('mouseleave', end);
            }

            let mobileKeys = { w: false, s: false, a: false, d: false };

            setupMobileButton(btnGas, 
                () => { mobileKeys.w = true; },
                () => { mobileKeys.w = false; }
            );
            setupMobileButton(btnBrake,
                () => { mobileKeys.s = true; },
                () => { mobileKeys.s = false; }
            );
            setupMobileButton(btnLeft,
                () => { mobileKeys.a = true; },
                () => { mobileKeys.a = false; }
            );
            setupMobileButton(btnRight,
                () => { mobileKeys.d = true; },
                () => { mobileKeys.d = false; }
            );

            // ============================================================
            // УПРАВЛЕНИЕ
            // ============================================================
            const keys = { w: false, s: false, a: false, d: false };
            let speed = 0;
            let strikes = 0;
            let raceTime = 0;
            let stunTimer = 0;
            let shakeTime = 0;
            let gameState = 'racing';

            const MAX_SPEED = 0.35;
            const ACCELERATION = 0.018;
            const BRAKE_FORCE = 0.025;
            const FRICTION_FORCE = 0.008;
            const MAX_X_SPEED = 0.55;
            const DRY_DAMPING = 0.82;
            const DRY_STEER = 3.2;

            function getKeys() {
                if (isMobile) {
                    return {
                        w: keys.w || mobileKeys.w,
                        s: keys.s || mobileKeys.s,
                        a: keys.a || mobileKeys.a,
                        d: keys.d || mobileKeys.d
                    };
                }
                return keys;
            }

            const keydownHandler = (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'ц') { keys.w = true; e.preventDefault(); }
                if (k === 's' || k === 'ы') { keys.s = true; e.preventDefault(); }
                if (k === 'a' || k === 'ф') { keys.a = true; e.preventDefault(); }
                if (k === 'd' || k === 'в') { keys.d = true; e.preventDefault(); }
                if (k === 'q') {
                    if (gameState === 'racing') {
                        if (confirm('Выйти из заезда и начать заново?')) location.reload();
                    } else {
                        location.reload();
                    }
                }
                if (k === 'r' && gameState !== 'racing') { location.reload(); }
                if (soundEngine && soundEngine.audioCtx && soundEngine.audioCtx.state === 'suspended') {
                    soundEngine.audioCtx.resume();
                    soundEngine.startMusic();
                }
            };

            const keyupHandler = (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'ц') { keys.w = false; e.preventDefault(); }
                if (k === 's' || k === 'ы') { keys.s = false; e.preventDefault(); }
                if (k === 'a' || k === 'ф') { keys.a = false; e.preventDefault(); }
                if (k === 'd' || k === 'в') { keys.d = false; e.preventDefault(); }
            };

            document.addEventListener('keydown', keydownHandler);
            document.addEventListener('keyup', keyupHandler);

            document.addEventListener('click', () => {
                if (soundEngine && soundEngine.audioCtx && soundEngine.audioCtx.state === 'suspended') {
                    soundEngine.audioCtx.resume();
                    soundEngine.startMusic();
                }
            });

            // ============================================================
            // RESIZE
            // ============================================================
            const resizeHandler = () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };
            window.addEventListener('resize', resizeHandler);

            // ============================================================
            // ФУНКЦИИ ДЛЯ HUD
            // ============================================================
            function showTimePenaltyPopup(seconds, animalName = '') {
                const timeEl = document.getElementById('timeDisplay');
                if (!timeEl) return;
                const rect = timeEl.getBoundingClientRect();
                const popup = document.createElement('div');
                const text = animalName ? `${animalName}: -${seconds}с` : `-${seconds}с`;
                popup.textContent = text;
                popup.style.cssText = `
                    position: fixed; left: ${rect.right + 10}px; top: ${rect.top - 2}px;
                    color: #ff3333; font-weight: bold; font-size: 18px;
                    font-family: 'Segoe UI', Arial, sans-serif;
                    pointer-events: none; z-index: 200;
                    animation: timePenaltyFloat 1s ease-out forwards;
                `;
                document.body.appendChild(popup);
                setTimeout(() => popup.remove(), 1000);
                timeEl.classList.add('time-hit-flash');
                setTimeout(() => timeEl.classList.remove('time-hit-flash'), 350);
            }

            function handleObstacleHit(obs) {
                if (gameState !== 'racing') return;
                strikes++;
                speed *= obs.penalty || 0.35;
                stunTimer = 0.4;
                shakeTime = 0.35;

                const penaltySeconds = obs.timePenalty || 4;
                raceTime += penaltySeconds;
                
                const animalName = obs.type === 'animal' ? ANIMAL_TYPES[obs.speciesKey]?.name : '';
                showTimePenaltyPopup(penaltySeconds, animalName);

                soundEngine.playCrashSound(0.6);

                updateHUD();

                if (strikes >= MAX_STRIKES) {
                    endGame('crash');
                }
            }

            // ============================================================
            // СИСТЕМА ЧАСТИЦ
            // ============================================================
            class ParticleSystem {
                constructor(scene) {
                    this.scene = scene;
                    this.maxParticles = 120;
                    this.enabled = true;
                    this.geometry = new THREE.BufferGeometry();
                    this.positions = new Float32Array(this.maxParticles * 3);
                    this.sizes = new Float32Array(this.maxParticles);
                    this.opacities = new Float32Array(this.maxParticles);
                    this.velocities = [];
                    this.lifetimes = [];

                    for (let i = 0; i < this.maxParticles; i++) {
                        this.positions[i * 3] = 0;
                        this.positions[i * 3 + 1] = 0;
                        this.positions[i * 3 + 2] = 0;
                        this.sizes[i] = 0;
                        this.opacities[i] = 0;
                        this.velocities.push({ x: 0, y: 0, z: 0 });
                        this.lifetimes.push(0);
                    }

                    this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
                    this.geometry.setAttribute('size', new THREE.BufferAttribute(this.sizes, 1));
                    this.geometry.setAttribute('opacity', new THREE.BufferAttribute(this.opacities, 1));

                    const material = new THREE.ShaderMaterial({
                        uniforms: { color: { value: new THREE.Color(0xD2B48C) } },
                        vertexShader: `
                            attribute float size; attribute float opacity; varying float vOpacity;
                            void main() {
                                vOpacity = opacity;
                                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                                gl_PointSize = size * (250.0 / max(-mvPosition.z, 0.01));
                                gl_Position = projectionMatrix * mvPosition;
                            }
                        `,
                        fragmentShader: `
                            uniform vec3 color; varying float vOpacity;
                            void main() {
                                float d = length(gl_PointCoord - vec2(0.5));
                                if (d > 0.5) discard;
                                float alpha = smoothstep(0.5, 0.1, d) * vOpacity;
                                gl_FragColor = vec4(color, alpha);
                            }
                        `,
                        transparent: true,
                        blending: THREE.NormalBlending,
                        depthWrite: false
                    });

                    this.points = new THREE.Points(this.geometry, material);
                    this.scene.add(this.points);
                    this.particleIndex = 0;
                }

                emit(position, velocity, count = 2, customSize = 0.15) {
                    if (!this.enabled) return;
                    const density = quality === 'high' ? 2 : quality === 'medium' ? 1 : 0.5;
                    const actualCount = Math.max(1, Math.floor(count * density));
                    for (let i = 0; i < actualCount; i++) {
                        const idx = this.particleIndex % this.maxParticles;
                        this.particleIndex++;
                        const i3 = idx * 3;

                        this.positions[i3] = position.x + (Math.random() - 0.5) * 0.15;
                        this.positions[i3 + 1] = position.y + 0.02;
                        this.positions[i3 + 2] = position.z + (Math.random() - 0.5) * 0.1;

                        this.sizes[idx] = customSize * (0.6 + Math.random() * 0.8);
                        this.opacities[idx] = 0.4 + Math.random() * 0.3;

                        this.velocities[idx] = {
                            x: velocity.x + (Math.random() - 0.5) * 0.4,
                            y: Math.random() * 0.3 + 0.1,
                            z: velocity.z + Math.random() * 0.5
                        };
                        this.lifetimes[idx] = 0.6 + Math.random() * 0.4;
                    }
                }

                update(deltaTime) {
                    if (!this.enabled) return;
                    for (let i = 0; i < this.maxParticles; i++) {
                        const i3 = i * 3;
                        if (this.opacities[i] > 0.01) {
                            this.lifetimes[i] -= deltaTime;
                            if (this.lifetimes[i] <= 0) {
                                this.opacities[i] = 0;
                                this.sizes[i] = 0;
                                continue;
                            }

                            this.positions[i3] += this.velocities[i].x * deltaTime;
                            this.positions[i3 + 1] += this.velocities[i].y * deltaTime;
                            this.positions[i3 + 2] += this.velocities[i].z * deltaTime;

                            this.velocities[i].x *= 0.95;
                            this.velocities[i].z *= 0.95;
                            this.velocities[i].y += 0.05 * deltaTime;

                            const lifeRatio = this.lifetimes[i] / 1.0;
                            this.opacities[i] = Math.max(0, lifeRatio * 0.5);
                            this.sizes[i] *= 1.02;
                        }
                    }
                    this.geometry.attributes.position.needsUpdate = true;
                    this.geometry.attributes.size.needsUpdate = true;
                    this.geometry.attributes.opacity.needsUpdate = true;
                }

                dispose() {
                    if (this.geometry) this.geometry.dispose();
                    if (this.points && this.points.material) this.points.material.dispose();
                    if (this.points) this.scene.remove(this.points);
                }
            }

            const particleSystem = new ParticleSystem(scene);

            // ============================================================
            // ЖИВОТНЫЕ
            // ============================================================
            const animalSpawner = new AnimalSpawner(
                scene, TRACK_WIDTH, 0, FINISH_Z, TRIGGER_LOOKAHEAD,
                config.maxAnimals, config.animalSpawnRate
            );

            function initAnimals() {
                const startZ = START_Z - 8;
                ANIMAL_KEYS.forEach((typeId, index) => {
                    const z = startZ - index * 5 - Math.random() * 3;
                    if (z > FINISH_Z) {
                        const animal = animalSpawner.createAnimal(z, typeId);
                        animal.triggered = true;
                        animal.mesh.visible = true;
                        animal.elapsed = 0.2;
                        animalSpawner.animals.push(animal);
                        animalSpawner.totalSpawned++;
                        animalSpawner.speciesCount[typeId] = (animalSpawner.speciesCount[typeId] || 0) + 1;
                    }
                });
            }
            initAnimals();

            // ============================================================
            // ФАРЫ
            // ============================================================
            const headlight1 = new THREE.SpotLight(0xffeedd, 0);
            headlight1.angle = 0.4;
            headlight1.penumbra = 0.7;
            headlight1.decay = 1.5;
            headlight1.distance = 40;
            scene.add(headlight1);
            headlight1.target = new THREE.Object3D();
            scene.add(headlight1.target);

            const headlight2 = new THREE.SpotLight(0xffeedd, 0);
            headlight2.angle = 0.4;
            headlight2.penumbra = 0.7;
            headlight2.decay = 1.5;
            headlight2.distance = 40;
            scene.add(headlight2);
            headlight2.target = new THREE.Object3D();
            scene.add(headlight2.target);

            // ============================================================
            // ИГРОВОЙ ЦИКЛ
            // ============================================================
            function update(deltaTime) {
                if (gameState !== 'racing') return;
                
                raceTime += deltaTime;
                const progress = Math.min(1, ((START_Z - zPos) / (START_Z - FINISH_Z)));
                
                const currentKeys = getKeys();

                if (stunTimer > 0) {
                    stunTimer -= deltaTime;
                    if (speed > 0) speed = Math.max(speed - FRICTION_FORCE * 2, 0);
                } else if (currentKeys.w) {
                    speed = Math.min(speed + ACCELERATION, MAX_SPEED);
                } else if (currentKeys.s) {
                    speed = Math.max(speed - BRAKE_FORCE, -MAX_SPEED * 0.2);
                } else {
                    if (speed > 0) speed = Math.max(speed - FRICTION_FORCE, 0);
                }

                soundEngine.update(speed);

                if (currentKeys.a) {
                    xVelocity = Math.max(xVelocity - DRY_STEER * deltaTime, -MAX_X_SPEED);
                } else if (currentKeys.d) {
                    xVelocity = Math.min(xVelocity + DRY_STEER * deltaTime, MAX_X_SPEED);
                } else {
                    xVelocity *= DRY_DAMPING;
                    if (Math.abs(xVelocity) < 0.001) xVelocity = 0;
                }
                xPos += xVelocity * deltaTime * 15;

                const globalMaxX = TRACK_WIDTH / 2 - CAR_WIDTH / 2 - 0.1;
                xPos = clamp(xPos, -globalMaxX, globalMaxX);

                const moveAmount = speed * 60 * deltaTime;
                zPos -= moveAmount;

                if (Math.abs(speed) > 0.05) {
                    const pos = playerCar.position;
                    for (let side of [-0.35, 0.35]) {
                        _v.p1.set(pos.x + side, pos.y, pos.z + 0.6);
                        _v.vel.set(
                            -xVelocity * 0.5 + (Math.random() - 0.5) * 0.2,
                            0.2 + Math.random() * 0.3,
                            speed * 1.5 + Math.random() * 0.5
                        );
                        particleSystem.emit(_v.p1, _v.vel, 1, 0.12);
                    }
                }

                playerCar.position.set(xPos, 0.1, zPos);
                playerCar.rotation.z = lerp(playerCar.rotation.z, -xVelocity * 0.04, 0.12);

                headlight1.position.copy(playerCar.position);
                headlight1.position.x -= 0.3;
                headlight1.position.y += 0.3;
                headlight1.position.z -= 0.8;
                headlight1.target.position.copy(playerCar.position);
                headlight1.target.position.z -= 10;
                
                headlight2.position.copy(playerCar.position);
                headlight2.position.x += 0.3;
                headlight2.position.y += 0.3;
                headlight2.position.z -= 0.8;
                headlight2.target.position.copy(playerCar.position);
                headlight2.target.position.z -= 10;

                // Ночная зона
                const isNight = HAS_NIGHT_ZONE && zPos > -NIGHT_ZONE_END && zPos < -NIGHT_ZONE_START;
                
                if (isNight) {
                    const nightProgress = Math.abs(zPos + NIGHT_ZONE_START) / (NIGHT_ZONE_END - NIGHT_ZONE_START);
                    const opacity = Math.sin(nightProgress * Math.PI) * 0.7;
                    nightOverlay.material.opacity = opacity;
                    
                    headlight1.intensity = 1.8;
                    headlight2.intensity = 1.8;
                    
                    ambient.intensity = 0.08;
                    scene.background = new THREE.Color(0x080818);
                    scene.fog.color = new THREE.Color(0x080818);
                } else {
                    nightOverlay.material.opacity = 0;
                    headlight1.intensity = 0;
                    headlight2.intensity = 0;
                    ambient.intensity = 0.55;
                    scene.background = new THREE.Color(0x4a8db7);
                    scene.fog.color = new THREE.Color(0x4a8db7);
                }

                // Попутные машины
                cars.forEach(car => {
                    if (!car.active) return;
                    
                    car.z -= car.speed * 60 * deltaTime;
                    car.mesh.position.z = car.z;
                    
                    if (car.isChangingLane) {
                        car.laneChangeProgress += deltaTime * 1.5;
                        if (car.laneChangeProgress >= 1) {
                            car.laneChangeProgress = 0;
                            car.isChangingLane = false;
                            car.lane = car.targetLane;
                            car.x = -TRACK_WIDTH / 2 + 0.5 + car.lane * 2;
                            car.mesh.position.x = car.x;
                        } else {
                            const currentX = -TRACK_WIDTH / 2 + 0.5 + car.lane * 2;
                            const targetX = -TRACK_WIDTH / 2 + 0.5 + car.targetLane * 2;
                            car.x = currentX + (targetX - currentX) * car.laneChangeProgress;
                            car.mesh.position.x = car.x;
                        }
                    } else {
                        car.laneChangeTimer -= deltaTime;
                        if (car.laneChangeTimer <= 0 && Math.random() < 0.02 * (1 + progress * 0.5)) {
                            const newLane = Math.floor(Math.random() * 3);
                            if (newLane !== car.lane) {
                                car.targetLane = newLane;
                                car.isChangingLane = true;
                                car.laneChangeProgress = 0;
                            }
                            car.laneChangeTimer = 2 + Math.random() * 3;
                        }
                    }
                    
                    if (car.hitCooldown > 0) car.hitCooldown -= deltaTime;
                    const dx = xPos - car.x;
                    const dz = zPos - car.z;
                    if (car.hitCooldown <= 0 && Math.abs(dx) < 0.7 && Math.abs(dz) < 0.7) {
                        car.hitCooldown = 1.2;
                        handleObstacleHit({ penalty: 0.3, timePenalty: 4 });
                    }
                    
                    if (car.z < -TRACK_LENGTH / 2 - 10) {
                        car.z = TRACK_LENGTH / 2 + 10 + Math.random() * 20;
                        car.lane = Math.floor(Math.random() * 3);
                        car.targetLane = car.lane;
                        car.x = -TRACK_WIDTH / 2 + 0.5 + car.lane * 2;
                        car.mesh.position.set(car.x, 0.1, car.z);
                        car.speed = 0.01 + Math.random() * 0.025 * (1 + progress * 0.3);
                        car.laneChangeTimer = 2 + Math.random() * 3;
                        car.isChangingLane = false;
                        car.laneChangeProgress = 0;
                        car.hitCooldown = 0;
                    }
                });

                // Препятствия
                obstacles.forEach(obs => {
                    if (!obs.active) return;
                    
                    const dx = xPos - obs.x;
                    const dz = zPos - obs.z;
                    
                    if (Math.abs(dx) < 0.4 && Math.abs(dz) < 0.4) {
                        if (obs.type === 'pothole') {
                            speed *= 0.3;
                            stunTimer = 0.3;
                            soundEngine.playCrashSound(0.3);
                            showTimePenaltyPopup(2, 'Яма');
                        } else {
                            speed *= 0.6;
                            playerCar.position.y = 0.35;
                            setTimeout(() => { playerCar.position.y = 0.1; }, 150);
                            showTimePenaltyPopup(1.5, 'Кочка');
                        }
                        obs.active = false;
                        obs.mesh.visible = false;
                    }
                });

                // Животные
                animalSpawner.update(deltaTime, zPos);

                if (gameState === 'racing') {
                    const activeAnimals = animalSpawner.getActiveAnimals();
                    activeAnimals.forEach(obs => {
                        if (obs.hit) return;
                        const dx = xPos - obs.x;
                        const dz = zPos - obs.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        if (dist < obs.radius + 0.45) {
                            obs.hit = true;
                            handleObstacleHit(obs);
                        }
                    });
                }

                // Победа / Поражение
                if (gameState === 'racing' && zPos <= FINISH_Z - 15) {
                    endGame('win');
                }
                if (gameState === 'racing' && raceTime >= TIME_LIMIT) {
                    endGame('timeout');
                }

                // Камера
                const targetX = xPos * 0.35;
                const targetY = isNight ? 3.8 : 4.2;
                const targetZ = zPos + (isNight ? 7 : 9);
                camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.08);
                camera.lookAt(xPos, 0.5, zPos - 12);

                if (shakeTime > 0) {
                    shakeTime -= deltaTime;
                    const power = Math.max(0, shakeTime) * 0.3;
                    camera.position.x += (Math.random() - 0.5) * power;
                    camera.position.y += (Math.random() - 0.5) * power;
                }

                sunLight.position.set(xPos + 30, 50, zPos + 20);
                sunLight.target.position.set(xPos, 0, zPos);
                sunLight.target.updateMatrixWorld();

                particleSystem.update(deltaTime);
                updateHUD();
            }

            // ============================================================
            // АНИМАЦИЯ
            // ============================================================
            let lastTime = performance.now();
            let animationId = null;

            function animate(currentTime) {
                animationId = requestAnimationFrame(animate);
                if (gameState !== 'racing') {
                    // Continue rendering a few frames for shake/effects, but no need to stop completely
                    renderer.render(scene, camera);
                    return;
                }
                const deltaTime = Math.min(0.05, (currentTime - lastTime) / 1000);
                lastTime = currentTime;
                update(deltaTime);
                renderer.render(scene, camera);
            }

            const style = document.createElement('style');
            style.textContent = `
                @keyframes timePenaltyFloat {
                    0% { opacity: 1; transform: translateY(0); }
                    100% { opacity: 0; transform: translateY(-30px); }
                }
                @keyframes timeHitPulse {
                    0% { transform: scale(1.4); }
                    100% { transform: scale(1); }
                }
                .time-hit-flash {
                    animation: timeHitPulse 0.35s ease-out;
                    color: #ff3333 !important;
                }
            `;
            document.head.appendChild(style);

            animate(performance.now());
            console.log('🏁 Игра запущена!');
        }

        // ============================================================
        // ПОКАЗ ЭКРАНА ВЫБОРА СЛОЖНОСТИ
        // ============================================================
        window.showDifficultyScreen = function() {
            // Удаляем старые элементы игры
            const container = document.getElementById('game-container');
            while (container.firstChild) container.removeChild(container.firstChild);
            
            const oldHud = document.getElementById('game-hud');
            if (oldHud) oldHud.remove();
            const oldFinish = document.getElementById('finish-screen');
            if (oldFinish) oldFinish.remove();
            
            // Показываем экран выбора сложности
            const screen = document.getElementById('difficulty-screen');
            screen.style.display = 'flex';
            
            // Обновляем лучшее время
            const times = getBestTimes();
            const bestEl = document.getElementById('bestTimeDisplay');
            if (bestEl) {
                const bests = [];
                if (times.easy) bests.push(`🟢 ${formatTime(times.easy)}`);
                if (times.medium) bests.push(`🟡 ${formatTime(times.medium)}`);
                if (times.hard) bests.push(`🔴 ${formatTime(times.hard)}`);
                bestEl.textContent = bests.length ? '🏆 ' + bests.join(' · ') : '🏆 Лучшее время: --';
            }
        };

        // ============================================================
        // НАСТРОЙКИ КАЧЕСТВА
        // ============================================================
        let selectedQuality = 'medium';

        document.querySelectorAll('.quality-selector .q-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.quality-selector .q-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedQuality = btn.dataset.quality;
            });
        });

        // ============================================================
        // ЗАПУСК
        // ============================================================
        // Обработчики кнопок сложности
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const difficulty = btn.dataset.diff;
                const quality = selectedQuality;
                
                const screen = document.getElementById('difficulty-screen');
                screen.style.display = 'none';
                
                // Запускаем игру
                setTimeout(() => {
                    initGame(quality, difficulty);
                }, 100);
            });
        });

        // Обновляем лучшее время при загрузке
        const times = getBestTimes();
        const bestEl = document.getElementById('bestTimeDisplay');
        if (bestEl) {
            const bests = [];
            if (times.easy) bests.push(`🟢 ${formatTime(times.easy)}`);
            if (times.medium) bests.push(`🟡 ${formatTime(times.medium)}`);
            if (times.hard) bests.push(`🔴 ${formatTime(times.hard)}`);
            bestEl.textContent = bests.length ? '🏆 ' + bests.join(' · ') : '🏆 Лучшее время: --';
        }

        console.log('🎮 Выберите сложность и начните игру!');
    </script>
</body>
