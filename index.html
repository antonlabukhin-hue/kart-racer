            function handleObstacleHit(obs) {
                if (gameState !== 'racing') return;
                strikes++;
                speed *= obs.penalty || 0.35;
                stunTimer = 0.4;
                shakeTime = 0.35;

                const penaltySeconds = obs.timePenalty || 4;
                raceTime += penaltySeconds;
                
                const animalName = obs.type === 'animal' ? ANIMAL_TYPES[obs.speciesKey]?.name : '';
                showTimePenaltyPopup(penaltySeconds, animalName);

                soundEngine.playCrashSound(0.6);

                updateHUD();

                if (strikes >= MAX_STRIKES) {
                    endGame('crash');
                }
            }

            // ============================================================
            // СИСТЕМА ЧАСТИЦ
            // ============================================================
            class ParticleSystem {
                constructor(scene) {
                    this.scene = scene;
                    this.maxParticles = 120;
                    this.enabled = true;
                    this.geometry = new THREE.BufferGeometry();
                    this.positions = new Float32Array(this.maxParticles * 3);
                    this.sizes = new Float32Array(this.maxParticles);
                    this.opacities = new Float32Array(this.maxParticles);
                    this.velocities = [];
                    this.lifetimes = [];

                    for (let i = 0; i < this.maxParticles; i++) {
                        this.positions[i * 3] = 0;
                        this.positions[i * 3 + 1] = 0;
                        this.positions[i * 3 + 2] = 0;
                        this.sizes[i] = 0;
                        this.opacities[i] = 0;
                        this.velocities.push({ x: 0, y: 0, z: 0 });
                        this.lifetimes.push(0);
                    }

                    this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
                    this.geometry.setAttribute('size', new THREE.BufferAttribute(this.sizes, 1));
                    this.geometry.setAttribute('opacity', new THREE.BufferAttribute(this.opacities, 1));

                    const material = new THREE.ShaderMaterial({
                        uniforms: { color: { value: new THREE.Color(0xD2B48C) } },
                        vertexShader: `
                            attribute float size; attribute float opacity; varying float vOpacity;
                            void main() {
                                vOpacity = opacity;
                                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                                gl_PointSize = size * (250.0 / max(-mvPosition.z, 0.01));
                                gl_Position = projectionMatrix * mvPosition;
                            }
                        `,
                        fragmentShader: `
                            uniform vec3 color; varying float vOpacity;
                            void main() {
                                float d = length(gl_PointCoord - vec2(0.5));
                                if (d > 0.5) discard;
                                float alpha = smoothstep(0.5, 0.1, d) * vOpacity;
                                gl_FragColor = vec4(color, alpha);
                            }
                        `,
                        transparent: true,
                        blending: THREE.NormalBlending,
                        depthWrite: false
                    });

                    this.points = new THREE.Points(this.geometry, material);
                    this.scene.add(this.points);
                    this.particleIndex = 0;
                }

                emit(position, velocity, count = 2, customSize = 0.15) {
                    if (!this.enabled) return;
                    for (let i = 0; i < count; i++) {
                        const idx = this.particleIndex % this.maxParticles;
                        this.particleIndex++;
                        const i3 = idx * 3;

                        this.positions[i3] = position.x + (Math.random() - 0.5) * 0.15;
                        this.positions[i3 + 1] = position.y + 0.02;
                        this.positions[i3 + 2] = position.z + (Math.random() - 0.5) * 0.1;

                        this.sizes[idx] = customSize * (0.6 + Math.random() * 0.8);
                        this.opacities[idx] = 0.4 + Math.random() * 0.3;

                        this.velocities[idx] = {
                            x: velocity.x + (Math.random() - 0.5) * 0.4,
                            y: Math.random() * 0.3 + 0.1,
                            z: velocity.z + Math.random() * 0.5
                        };
                        this.lifetimes[idx] = 0.6 + Math.random() * 0.4;
                    }
                }

                update(deltaTime) {
                    if (!this.enabled) return;
                    for (let i = 0; i < this.maxParticles; i++) {
                        const i3 = i * 3;
                        if (this.opacities[i] > 0.01) {
                            this.lifetimes[i] -= deltaTime;
                            if (this.lifetimes[i] <= 0) {
                                this.opacities[i] = 0;
                                this.sizes[i] = 0;
                                continue;
                            }

                            this.positions[i3] += this.velocities[i].x * deltaTime;
                            this.positions[i3 + 1] += this.velocities[i].y * deltaTime;
                            this.positions[i3 + 2] += this.velocities[i].z * deltaTime;

                            this.velocities[i].x *= 0.95;
                            this.velocities[i].z *= 0.95;
                            this.velocities[i].y += 0.05 * deltaTime;

                            const lifeRatio = this.lifetimes[i] / 1.0;
                            this.opacities[i] = Math.max(0, lifeRatio * 0.5);
                            this.sizes[i] *= 1.02;
                        }
                    }
                    this.geometry.attributes.position.needsUpdate = true;
                    this.geometry.attributes.size.needsUpdate = true;
                    this.geometry.attributes.opacity.needsUpdate = true;
                }

                dispose() {
                    if (this.geometry) this.geometry.dispose();
                    if (this.points && this.points.material) this.points.material.dispose();
                    if (this.points) this.scene.remove(this.points);
                }
            }

            const particleSystem = new ParticleSystem(scene);

            // ============================================================
            // ИГРОВОЙ ЦИКЛ
            // ============================================================
            function update(deltaTime) {
                if (gameState !== 'racing') return;
                
                raceTime += deltaTime;
                const progress = Math.min(1, ((START_Z - zPos) / (START_Z - FINISH_Z)));

                // Газ/Тормоз
                if (stunTimer > 0) {
                    stunTimer -= deltaTime;
                    if (speed > 0) speed = Math.max(speed - FRICTION_FORCE * 2, 0);
                } else if (keys.w) {
                    speed = Math.min(speed + ACCELERATION, MAX_SPEED);
                } else if (keys.s) {
                    speed = Math.max(speed - BRAKE_FORCE, -MAX_SPEED * 0.2);
                } else {
                    if (speed > 0) speed = Math.max(speed - FRICTION_FORCE, 0);
                }

                soundEngine.update(speed);

                // Руль
                if (keys.a) {
                    xVelocity = Math.max(xVelocity - DRY_STEER * deltaTime, -MAX_X_SPEED);
                } else if (keys.d) {
                    xVelocity = Math.min(xVelocity + DRY_STEER * deltaTime, MAX_X_SPEED);
                } else {
                    xVelocity *= DRY_DAMPING;
                    if (Math.abs(xVelocity) < 0.001) xVelocity = 0;
                }
                xPos += xVelocity * deltaTime * 15;

                const globalMaxX = TRACK_WIDTH / 2 - CAR_WIDTH / 2 - 0.1;
                xPos = clamp(xPos, -globalMaxX, globalMaxX);

                // Движение вперед
                const moveAmount = speed * 60 * deltaTime;
                zPos -= moveAmount;

                // Пыль
                if (Math.abs(speed) > 0.05) {
                    const pos = playerCar.position;
                    for (let side of [-0.35, 0.35]) {
                        _v.p1.set(pos.x + side, pos.y, pos.z + 0.6);
                        _v.vel.set(
                            -xVelocity * 0.5 + (Math.random() - 0.5) * 0.2,
                            0.2 + Math.random() * 0.3,
                            speed * 1.5 + Math.random() * 0.5
                        );
                        particleSystem.emit(_v.p1, _v.vel, 1, 0.12);
                    }
                }

                // Позиция игрока
                playerCar.position.set(xPos, 0.1, zPos);
                playerCar.rotation.z = lerp(playerCar.rotation.z, -xVelocity * 0.04, 0.12);

                // ============================================================
                // ПОПУТНЫЕ МАШИНЫ
                // ============================================================
                cars.forEach(car => {
                    if (!car.active) return;
                    
                    car.z -= car.speed * 60 * deltaTime;
                    car.mesh.position.z = car.z;
                    
                    if (car.isChangingLane) {
                        car.laneChangeProgress += deltaTime * 1.5;
                        if (car.laneChangeProgress >= 1) {
                            car.laneChangeProgress = 0;
                            car.isChangingLane = false;
                            car.lane = car.targetLane;
                            car.x = -TRACK_WIDTH / 2 + 0.5 + car.lane * 2;
                            car.mesh.position.x = car.x;
                        } else {
                            const currentX = -TRACK_WIDTH / 2 + 0.5 + car.lane * 2;
                            const targetX = -TRACK_WIDTH / 2 + 0.5 + car.targetLane * 2;
                            car.x = currentX + (targetX - currentX) * car.laneChangeProgress;
                            car.mesh.position.x = car.x;
                        }
                    } else {
                        car.laneChangeTimer -= deltaTime;
                        if (car.laneChangeTimer <= 0 && Math.random() < 0.02 * (1 + progress * 0.5)) {
                            const newLane = Math.floor(Math.random() * 3);
                            if (newLane !== car.lane) {
                                car.targetLane = newLane;
                                car.isChangingLane = true;
                                car.laneChangeProgress = 0;
                            }
                            car.laneChangeTimer = 2 + Math.random() * 3;
                        }
                    }
                    
                    const dx = xPos - car.x;
                    const dz = zPos - car.z;
                    if (Math.abs(dx) < 0.7 && Math.abs(dz) < 0.7) {
                        handleObstacleHit({ penalty: 0.3, timePenalty: 4 });
                    }
                    
                    if (car.z < -TRACK_LENGTH / 2 - 10) {
                        car.z = TRACK_LENGTH / 2 + 10 + Math.random() * 20;
                        car.lane = Math.floor(Math.random() * 3);
                        car.targetLane = car.lane;
                        car.x = -TRACK_WIDTH / 2 + 0.5 + car.lane * 2;
                        car.mesh.position.set(car.x, 0.1, car.z);
                        car.speed = 0.01 + Math.random() * 0.025 * (1 + progress * 0.3);
                        car.laneChangeTimer = 2 + Math.random() * 3;
                        car.isChangingLane = false;
                        car.laneChangeProgress = 0;
                    }
                });

                // ============================================================
                // ПРЕПЯТСТВИЯ
                // ============================================================
                obstacles.forEach(obs => {
                    if (!obs.active) return;
                    
                    const dx = xPos - obs.x;
                    const dz = zPos - obs.z;
                    
                    if (Math.abs(dx) < 0.4 && Math.abs(dz) < 0.4) {
                        if (obs.type === 'pothole') {
                            speed *= 0.3;
                            stunTimer = 0.3;
                            soundEngine.playCrashSound(0.3);
                            showTimePenaltyPopup(2, 'Яма');
                        } else {
                            speed *= 0.6;
                            playerCar.position.y = 0.35;
                            setTimeout(() => { playerCar.position.y = 0.1; }, 150);
                            showTimePenaltyPopup(1.5, 'Кочка');
                        }
                        obs.active = false;
                        obs.mesh.visible = false;
                    }
                });

                // ============================================================
                // ЖИВОТНЫЕ
                // ============================================================
                animalSpawner.update(deltaTime, zPos);

                if (gameState === 'racing') {
                    const activeAnimals = animalSpawner.getActiveAnimals();
                    activeAnimals.forEach(obs => {
                        if (obs.hit) return;
                        const dx = xPos - obs.x;
                        const dz = zPos - obs.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        if (dist < obs.radius + 0.45) {
                            obs.hit = true;
                            handleObstacleHit(obs);
                        }
                    });
                }

                // ============================================================
                // ПОБЕДА / ПОРАЖЕНИЕ
                // ============================================================
                if (gameState === 'racing' && zPos <= FINISH_Z - 15) {
                    endGame('win');
                }
                if (gameState === 'racing' && raceTime >= TIME_LIMIT) {
                    endGame('timeout');
                }

                // ============================================================
                // КАМЕРА - ПЛАВНОЕ СЛЕЖЕНИЕ
                // ============================================================
                const targetX = xPos * 0.35;
                const targetY = 4.2;
                const targetZ = zPos + 9;
                camera.position.x += (targetX - camera.position.x) * 0.06;
                camera.position.y += (targetY - camera.position.y) * 0.06;
                camera.position.z += (targetZ - camera.position.z) * 0.06;
                camera.lookAt(xPos, 0.5, zPos - 12);

                if (shakeTime > 0) {
                    shakeTime -= deltaTime;
                    const power = Math.max(0, shakeTime) * 0.3;
                    camera.position.x += (Math.random() - 0.5) * power;
                    camera.position.y += (Math.random() - 0.5) * power;
                }

                // ============================================================
                // ТЕНИ
                // ============================================================
                sunLight.position.set(xPos + 30, 50, zPos + 20);
                sunLight.target.position.set(xPos, 0, zPos);
                sunLight.target.updateMatrixWorld();

                particleSystem.update(deltaTime);
                updateHUD();
            }

            // ============================================================
            // АНИМАЦИЯ
            // ============================================================
            let lastTime = performance.now();

            function animate(currentTime) {
                requestAnimationFrame(animate);
                const deltaTime = Math.min(0.05, (currentTime - lastTime) / 1000);
                lastTime = currentTime;
                update(deltaTime);
                renderer.render(scene, camera);
            }

            const style = document.createElement('style');
            style.textContent = `
                @keyframes timePenaltyFloat {
                    0% { opacity: 1; transform: translateY(0); }
                    100% { opacity: 0; transform: translateY(-30px); }
                }
                @keyframes timeHitPulse {
                    0% { transform: scale(1.4); }
                    100% { transform: scale(1); }
                }
                .time-hit-flash {
                    animation: timeHitPulse 0.35s ease-out;
                    color: #ff3333 !important;
                }
            `;
            document.head.appendChild(style);

            animate(performance.now());
            console.log('🏁 Игра запущена!');
            console.log('🎸 Музыка играет! Регулируйте громкость справа!');
            console.log('💡 Если хотите свою музыку - положите MP3 в папку music/');
        }

        // ============================================================
        // ЗАПУСК
        // ============================================================
        startGame().catch(err => console.error('Ошибка:', err));
    </script>
</body>
</html>
