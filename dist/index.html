<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карт Рейсер</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #controls kbd {
            background: rgba(255,255,255,0.1);
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            margin: 0 2px;
            font-weight: bold;
            color: #ffcc00;
        }
        
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255,200,0,0.3);
            z-index: 200;
            text-align: center;
            pointer-events: none;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 30px 50px;
            border-radius: 20px;
            border: 2px solid rgba(255,200,0,0.3);
            backdrop-filter: blur(10px);
        }
        #message .sub {
            font-size: 20px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
  <script type="module" crossorigin src="/assets/index-Ccev0jFi.js"></script>
</head>
<body>

    <!-- ТОЛЬКО УПРАВЛЕНИЕ И СООБЩЕНИЯ -->
    <div id="controls">
        <kbd>W</kbd> Газ · <kbd>S</kbd> Тормоз · <kbd>A</kbd> <kbd>D</kbd> Рулить · <kbd>R</kbd> Рестарт
    </div>

    <div id="message">
        <div id="msgTitle">🏆 ПОБЕДА!</div>
        <div class="sub" id="msgSub">Нажмите R для рестарта</div>
    </div>

    <!-- ИМПОРТ ТРЁХ -->

</body>
</html>
